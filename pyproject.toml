[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-acoustics"
version = "0.2.0"
description = "Representative Acoustic States analysis from spectrograms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "networkx>=3.0",
]

[project.optional-dependencies]
stsw = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
